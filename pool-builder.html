<style>
body { background: var(--navy); }
.cfg { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(380px, 1fr); height: calc(100vh - 64px); height: calc(100svh - 64px); }
.cfg-stage { position: relative; display: grid; place-items: center; padding: 40px; background: radial-gradient(ellipse at 50% 35%, #1b4a66 0%, var(--navy) 70%); overflow: hidden; }
.stage-inner { width: 100%; max-width: 980px; }
.scene { border-radius: 24px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); background: #dfeef3; }
.scene svg { display: block; width: 100%; height: auto; }
.stage-cap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 22px 0 0; padding: 0; list-style: none; }
.stage-cap li { font-size: 13px; color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 5px 12px; }
.cfg-panel { padding: 0; background: #fff; display: flex; flex-direction: column; min-height: 0; }
.stepnav { position: relative; display: flex; gap: 4px; list-style: none; margin: 0; padding: 18px 28px 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.stepnav button { background: none; border: 0; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted); padding: 10px 8px 14px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.stepnav button b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--sand); font-size: 11px; margin-right: 6px; color: var(--navy); }
.stepnav button.done b { background: var(--gold); }
.stepnav button[aria-current] { color: var(--navy); border-bottom-color: var(--gold); }
.panel-body { flex: 1; overflow-y: auto; padding: 30px 28px 28px; -webkit-overflow-scrolling: touch; }
.panel-body h1 { font-size: clamp(28px, 3vw, 36px); margin: 0 0 8px; }
.panel-body .sub { color: var(--muted); margin: 0 0 22px; font-size: 15.5px; line-height: 1.6; }
.panel-body h2 { font-size: 20px; margin: 26px 0 12px; }
.panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 28px; border-top: 1px solid var(--line); background: #fff; }
.panel-foot small { display: block; color: var(--muted); font-size: 12.5px; letter-spacing: .04em; }
.panel-foot strong { font-family: var(--serif); font-weight: 400; font-size: 30px; color: var(--navy); line-height: 1.1; }
.panel-foot .btn { margin: 0; padding: 14px 24px; white-space: nowrap; }
.back { background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer; padding: 0; margin: 0 0 14px; font-size: 14px; }
.quote-lines { list-style: none; padding: 0; margin: 0 0 6px; }
.quote-lines li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.quote-lines small { display: block; color: var(--muted); font-size: 13px; }
.quote-lines span:last-child { white-space: nowrap; font-weight: 600; color: var(--navy); }
.quote-total { display: flex; justify-content: space-between; font-family: var(--serif); font-size: 28px; color: var(--navy); margin: 14px 0 4px; }
.fine { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.qform { display: grid; gap: 12px; margin-top: 22px; }
.qform label { display: grid; gap: 5px; font-size: 14px; font-weight: 500; color: var(--navy); }
.qform input, .qform textarea { font: inherit; padding: 12px 14px; border: 1px solid #d9d3c9; border-radius: 12px; background: #fdfcfa; width: 100%; }
.qform input:focus, .qform textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(200,164,106,.2); }
.qform .btn { width: 100%; text-align: center; margin: 6px 0 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--teal); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
@media (max-width: 900px) {
  body { background: #fff; }
  .fh { position: static; }

  .cfg-stage { position: sticky; top: 0; z-index: 10; padding: 10px 12px 12px; }

<script src="/js/packages.js"></script>
<script>
var STEPS = [
  { id: "size",   label: "Pool",   title: "Choose your pool", sub: "A genuine Tarter USA galvanised stock tank from Terra Tanks. Both sizes are the same package price." },
  { id: "finish", label: "Colour", title: "Pick your colour", sub: "Colour coating is applied by Terra Tanks and charged at their price." },
  { id: "fence",  label: "Fence",  title: "Choose your pool fence", sub: "10 metres of compliant pool fence and a self-closing gate are included. We confirm the exact length at your free site visit." },
  { id: "deck",   label: "Deck",   title: "Design your deck", sub: "Built by a local carpenter around your pool." },
  { id: "land",   label: "Garden", title: "Choose your garden", sub: "Planted and finished by a local landscaper, so it looks great from day one." },
  { id: "extras", label: "Extras", title: "Add extras", sub: "Optional. Charged at Terra Tanks' own prices." },
  { id: "quote",  label: "Quote",  title: "Your quote", sub: "Every dollar, no surprises. Send it to yourself and we'll be in touch to book a free site visit." }
];

var state = PKG.fromHash(location.hash);
var step = 0;
var scene = document.getElementById("scene");
var panel = document.getElementById("panel");
var nextBtn = document.getElementById("next");

function thumb(key, id) {
  return ["size", "fence", "deckSize", "deckMat", "land"].indexOf(key) > -1
    ? '<img class="thumb" src="/images/pkg/' + key + '-' + id + '.jpg" alt="" width="240" height="150" loading="lazy">' : "";
}

function options(key, priceOf) {
  var multi = key === "extras";
  return '<div class="opts">' + PKG[key].map(function (o) {
    var checked = multi ? state.extras.indexOf(o.id) > -1 : state[key] === o.id;
    var price = priceOf ? priceOf(o) : o.price;
    var mark = o.color ? '<span class="swatch" style="background:' + o.color + '"></span>' : thumb(key, o.id) || '<span class="tick">✓</span>';
    return '<label class="opt' + (o.color ? " sw" : "") + '"><input type="' + (multi ? "checkbox" : "radio") + '" name="' + key + '" value="' + o.id + '"' + (checked ? " checked" : "") + '>' +
      mark + '<span class="opt-text"><b>' + o.name + '</b>' + (o.note ? '<small>' + o.note + '</small>' : '') + '</span>' +
      '<em class="' + (price ? "" : "inc") + '">' + PKG.priceText(price) + '</em></label>';
  }).join("") + '</div>';
}

function renderStep() {
  var s = STEPS[step];
  var html = (step ? '<button class="back" type="button" id="back">← Back</button>' : "") +
    '<h1>' + s.title + '</h1><p class="sub">' + s.sub + '</p>';
  if (s.id === "deck") {
    html += '<h2>Size</h2>' + options("deckSize", function (o) { return PKG.deckPrice[o.id][state.deckMat]; });
    html += '<h2>Boards</h2>' + options("deckMat", function (o) { return PKG.deckPrice[state.deckSize][o.id] - PKG.deckPrice[state.deckSize].composite; });
  } else if (s.id === "quote") {
    var q = PKG.quote(state);
    html += '<ul class="quote-lines">' + q.lines.map(function (l, i) {
      return '<li><span>' + l.label + '<small>' + l.detail + '</small></span><span>' + (i ? PKG.priceText(l.price) : PKG.money(l.price)) + '</span></li>';
    }).join("") + '</ul><p class="quote-total"><span>Total</span><span>' + PKG.money(q.total) + '</span></p>' +
      '<p class="fine">Includes GST. Perth metro. No payment today. We confirm your yard, fence length and final price at a free site visit. <button type="button" class="linkbtn" id="share">Copy a link to this design</button></p>' +
      '<form class="qform" id="qform" action="https://formsubmit.co/rossdelport1998@gmail.com" method="POST">' +
      '<input type="hidden" name="_template" value="table"><input type="hidden" name="_subject" id="f-subject">' +
      '<input type="hidden" name="_next" id="f-next"><input type="hidden" name="_autoresponse" id="f-auto">' +
      '<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">' +
      '<input type="hidden" name="quote_number" id="f-num"><input type="hidden" name="quote" id="f-quote"><input type="hidden" name="total" id="f-total"><input type="hidden" name="design_link" id="f-link">' +
      '<div class="two"><label>Your name <input name="name" required autocomplete="name"></label><label>Phone <input name="phone" type="tel" required autocomplete="tel"></label></div>' +
      '<div class="two"><label>Email <input name="email" type="email" required autocomplete="email"></label><label>Suburb <input name="suburb" required autocomplete="address-level2"></label></div>' +
      '<label>Anything we should know? <textarea name="notes" rows="2" placeholder="Slope, access, timing..."></textarea></label>' +
      '<button class="btn" type="submit">Send me this quote</button></form>';
  } else {
    html += options(s.id);
  }
  panel.innerHTML = html;
  panel.scrollTop = 0;

  // Step tabs
  document.getElementById("stepnav").innerHTML = STEPS.map(function (t, i) {
    return '<li><button type="button" data-step="' + i + '"' + (i === step ? ' aria-current="step"' : '') + (i < step ? ' class="done"' : '') + '><b>' + (i + 1) + '</b>' + t.label + '</button></li>';
  }).join("");
  var cur = document.querySelector(".stepnav [aria-current]");
  cur.parentNode.parentNode.scrollLeft = cur.offsetLeft - 40;
  nextBtn.style.display = s.id === "quote" ? "none" : "";
  if (s.id !== "quote") nextBtn.textContent = s.id === "extras" ? "See my quote" : "Next: " + STEPS[step + 1].label;
  var back = document.getElementById("back");
  if (back) back.onclick = function () { go(step - 1); };
  if (s.id === "quote") setupQuote();
}

function go(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  renderStep();
  if (window.innerWidth <= 900) window.scrollTo({ top: 0, behavior: "smooth" });
}

function draw() {
  var size = PKG.find("size", state.size), finish = PKG.find("finish", state.finish), mat = PKG.find("deckMat", state.deckMat);
  scene.style.setProperty("--tank", finish.color);
  scene.style.setProperty("--deck-top", mat.top);
  scene.style.setProperty("--deck-face", mat.face);
  document.getElementById("pool").setAttribute("transform", "translate(470 400) scale(" + size.scale + ") translate(-470 -400)");
  scene.querySelectorAll("[data-show]").forEach(function (g) {
    var kv = g.getAttribute("data-show").split(":");
    g.style.display = kv[1].split(",").indexOf(state[kv[0]]) > -1 ? "" : "none";
  });
  document.getElementById("total").textContent = PKG.money(PKG.quote(state).total);
  document.getElementById("cap").innerHTML = [size.name, finish.name, PKG.find("fence", state.fence).name, PKG.find("deckSize", state.deckSize).name + " " + mat.name.toLowerCase(), PKG.find("land", state.land).name]
    .map(function (t) { return "<li>" + t + "</li>"; }).join("");
  history.replaceState(null, "", "#" + PKG.toHash(state));
}

function link() { return location.origin + "/pool-builder.html#" + PKG.toHash(state); }

function setupQuote() {
  var q = PKG.quote(state);
  var num = "PCA-" + Date.now().toString(36).toUpperCase().slice(-6);
  var text = q.lines.map(function (l, i) { return l.label + ": " + (i ? PKG.priceText(l.price) : PKG.money(l.price)); }).join("\n");
  document.getElementById("f-num").value = num;
  document.getElementById("f-quote").value = text;
  document.getElementById("f-total").value = PKG.money(q.total) + " inc. GST";
  document.getElementById("f-link").value = link();
  document.getElementById("f-subject").value = "Pool quote " + num + ": " + PKG.money(q.total);
  document.getElementById("f-next").value = location.origin + "/quote-sent.html?n=" + num + "#" + PKG.toHash(state);
  document.getElementById("f-auto").value = "Thanks for designing your pool with us! Here is your quote " + num + ":\n\n" + text +
    "\n\nTotal: " + PKG.money(q.total) + " inc. GST\n\nView or change your design: " + link() +
    "\n\nWe'll call you within one business day to book a free site visit. Questions? Call Ross on 0400 369 865.";
  document.getElementById("share").onclick = function () {
    var b = this;
    navigator.clipboard.writeText(link()).then(function () { b.textContent = "Link copied!"; });
  };
}

panel.addEventListener("change", function (e) {
  var t = e.target;
  if (t.name === "extras") {
    state.extras = [].slice.call(panel.querySelectorAll('input[name="extras"]:checked')).map(function (i) { return i.value; });
  } else if (PKG.KEYS.indexOf(t.name) > -1) {
    state[t.name] = t.value;
  } else return;
  draw();
  if (STEPS[step].id === "deck") { var y = panel.scrollTop; renderStep(); panel.scrollTop = y; }
});
document.getElementById("stepnav").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (b) go(+b.getAttribute("data-step"));
});
nextBtn.addEventListener("click", function () { go(step + 1); });

if (/[?&]step=quote/.test(location.search)) step = STEPS.length - 1;
draw();
renderStep();
</script>
</body>
</html>
